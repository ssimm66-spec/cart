name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: |
          URL=$(grep -o "SUPA_URL = '[^']*'" index.html | cut -d"'" -f2)
          KEY=$(grep -o "SUPA_KEY = '[^']*'" index.html | cut -d"'" -f2)
          code=$(curl -sS -o body.txt -w '%{http_code}' \
            "$URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; cat body.txt; echo
          test "$code" = "200"
